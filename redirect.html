<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmyDub4u - Auto Link Generator</title>
    <style>
        body { 
            background: #111; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { 
            background: #161616; 
            max-width: 500px; 
            width: 100%; 
            padding: 30px; 
            border-radius: 8px; 
            border: 2px solid #ffb400; 
            box-shadow: 0 4px 25px rgba(255, 180, 0, 0.2); 
        }
        h2 { color: #ffb400; font-size: 1.8rem; margin-bottom: 10px; text-transform: uppercase; }
        p { color: #aaa; font-size: 1rem; margin-bottom: 20px; }
        input { 
            width: 100%; 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #222; 
            color: #fff; 
            font-size: 1rem; 
            outline: none; 
        }
        input:focus { border-color: #ffb400; }
        button { 
            background: #ffb400; 
            color: #000; 
            padding: 15px 30px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 1.1rem; 
            border-radius: 4px; 
            text-transform: uppercase; 
            width: 100%; 
            transition: 0.2s; 
        }
        button:hover { background: #fff; }
        .result { 
            margin-top: 25px; 
            background: #222; 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px dashed #ffb400; 
            word-break: break-all; 
            display: none; 
            color: #fff; 
            font-size: 1.05rem; 
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Link Generator 🚀</h2>
        <p>HDHub4u se copy kiya hua movie link niche paste krain:</p>
        <input type="text" id="movieInput" placeholder="https://hdhub4u.cl...">
        <button onclick="generateLink()">Generate Earning Link</button>
        <div id="resultBox" class="result"></div>
    </div>

    <script>
        function generateLink() {
            var rawUrl = document.getElementById('movieInput').value.trim();
            if(!rawUrl) { alert('Please paste a link first!'); return; }
            
            // Base directory dynamic protocol selection
            var currentHost = window.location.protocol + "//" + window.location.host + window.location.pathname.replace('redirect.html', '');
            
            // Continuous unified automatic formatting
            var finalLink = currentHost + "?m=" + encodeURIComponent(rawUrl);
            
            var resBox = document.getElementById('resultBox');
            resBox.innerHTML = '<div>Your Earning Link:</div><div style="color:#ffb400; margin-top:10px; user-select:all; font-weight:bold;">' + finalLink + '</div><div style="font-size:0.85rem; color:#888; margin-top:5px;">(Is link ko long-press kar ke copy krain aur WhatsApp par share krain)</div>';
            resBox.style.display = 'block';
        }
    </script>

</body>
</html>
