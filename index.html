<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmyDub4u Official - Download Movies & Dramas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .gateway-container { 
            background: #161616; 
            padding: 40px 20px; 
            border-radius: 8px; 
            border: 2px solid #ffb400; 
            box-shadow: 0 4px 25px rgba(255, 180, 0, 0.3); 
            max-width: 450px; 
            width: 90%; 
        }
        
        .logo-box {
            border: 2px solid #ffb400;
            padding: 5px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo-box h1 { font-size: 2rem; font-weight: bold; color: #fff; letter-spacing: 2px; text-transform: uppercase; }
        .logo-box span { color: #ff0000; }
        h2 { font-size: 1.4rem; color: #fff; margin-bottom: 15px; }
        p { color: #aaa; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        
        .btn-unlock { 
            background: #ffb400; 
            color: #000; 
            padding: 15px 40px; 
            border: none; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 180, 0, 0.4);
            transition: 0.2s;
        }
        .btn-unlock:hover { background: #fff; transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-box"><h1>FilmyDub<span>4u</span></h1></div>
        <h2>Link Is Ready!</h2>
        <p>Click the button below to watch or download your selected movie / drama movie file.</p>
        <button class="btn-unlock" onclick="startEarningRedirect()">Unlock Link</button>
    </div>

    <script>
        function startEarningRedirect() {
            // 1. Aap ka asli Adsterra Direct Link
            var adLink = "https://effectivecpmnetwork.com"; 

            // 2. Exact dynamic tracking system
            const urlParams = new URLSearchParams(window.location.search);
            const targetMovie = urlParams.get('m');
            var finalDestination = targetMovie ? decodeURIComponent(targetMovie) : "https://hdhub4u.cl";

            // 100% Anti-Blocker System: Pehle same tab mein redirect mapping save hogi
            window.history.replaceState(null, null, window.location.pathname);
            
            // Background history back lock setup taake user back kare to movie khulay
            window.location.hash = "movie-download";
            window.onhashchange = function() {
                window.location.href = finalDestination;
            };

            // Direct action forced open in same window to completely bypass popup blockers
            window.location.href = adLink;
        }
    </script>

</body>
</html>
