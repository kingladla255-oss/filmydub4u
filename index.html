<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilmyDub4u Official - Download Movies & Dramas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        body { background-color: #0b0b0b; color: #fff; text-align: center; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .gateway-container { 
            background: #161616; 
            padding: 40px 20px; 
            border-radius: 8px; 
            border: 2px solid #ffb400; 
            box-shadow: 0 4px 25px rgba(255, 180, 0, 0.3); 
            max-width: 450px; 
            width: 90%; 
        }
        
        .logo-box {
            border: 2px solid #ffb400;
            padding: 5px 15px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .logo-box h1 {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo-box span { color: #ff0000; }

        h2 { font-size: 1.4rem; color: #fff; margin-bottom: 15px; }
        p { color: #aaa; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        
        .btn-unlock { 
            background: #ffb400; 
            color: #000; 
            padding: 15px 40px; 
            border: none; 
            font-weight: bold; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 180, 0, 0.4);
            transition: 0.2s;
        }
        .btn-unlock:hover { background: #fff; transform: scale(1.03); }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="logo-box">
            <h1>FilmyDub<span>4u</span></h1>
        </div>
        
        <h2>Link Is Ready!</h2>
        <p>Click the button below to watch or download your selected movie / drama movie file.</p>
        
        <button class="btn-unlock" onclick="startEarningRedirect()">Unlock Link</button>
    </div>

    <script>
        function startEarningRedirect() {
            var adLink = "https://effectivecpmnetwork.com"; 

            // Secure Extraction Matrix for Long URLs
            var currentUrl = window.location.href;
            var defaultDestination = "https://new1.hdhub4u.cl/?utm=mn1";
            var finalDestination = defaultDestination;

            if (currentUrl.includes("?m=")) {
                // Link partition system to handle query conflicts
                var urlParts = currentUrl.split("?m=");
                if (urlParts.length > 1) {
                    var rawMovieUrl = urlParts[1];
                    // Clean decode sequence to fix folder break loop
                    finalDestination = decodeURIComponent(rawMovieUrl);
                }
            }

            // Fallback safety layer
            if (!finalDestination.startsWith("http")) {
                finalDestination = defaultDestination;
            }

            // Open high-CPM Adsterra direct link
            window.open(adLink, '_blank');

            // Redirect user window to exact target movie menu
            window.location.href = finalDestination;
        }
    </script>

</body>
</html>
